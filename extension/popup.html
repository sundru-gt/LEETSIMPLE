<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <link href="popup.css" rel="stylesheet">
</head>

<body>
    <div class="container">
        <div class="header">
            <h2>LEETSIMPLE</h2>
        </div>
        <div class="status" id="status">Ready to analyze.</div>
        <button id="analyze-btn">Analyze Complexity</button>

        <div id="results" class="hidden">
            <div class="result-box">
                <div class="label">Time Complexity</div>
                <div class="value" id="res-time"></div>
            </div>
            <div class="result-box">
                <div class="label">Space Complexity</div>
                <div class="value" id="res-space"></div>
            </div>
            <button id="toggle-approach-btn" class="secondary-btn hidden">Show Approach</button>
            <div class="result-box hidden" id="box-approach">
                <div class="label">Approach</div>
                <div class="value text-content" id="res-approach"></div>
            </div>

            <button id="toggle-explanation-btn" class="secondary-btn hidden">Show Explanation</button>
            <div class="result-box hidden" id="box-explanation">
                <div class="label">Explanation</div>
                <div class="value text-content" id="res-explanation"></div>
            </div>
        </div>
    </div>
    <script src="popup.js"></script>
</body>

</html>
